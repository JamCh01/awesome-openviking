name: Suggest a project
description: Suggest an OpenViking ecosystem project without opening a pull request
title: "[Submission]: "
labels: [submission]
body:
  - type: input
    id: url
    attributes:
      label: Project URL
      description: A public GitHub repository or project website
      placeholder: https://github.com/owner/project
    validations:
      required: true
  - type: textarea
    id: connection
    attributes:
      label: How does it use OpenViking?
      description: Tell us what it does and why it is useful to the community.
    validations:
      required: true
  - type: input
    id: relationship
    attributes:
      label: Your relationship to the project
      description: Maintainer, contributor, user, or other
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: The project is publicly accessible and has documentation.
          required: true
